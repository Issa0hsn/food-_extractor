<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>food extraction</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
    <div id="header">
        <h1>food extraction</h1>
        <p>this model extracts food and drink items from text.</p>
    </div>
    <div id="demo">
        <div id="inputText">
            <textarea id="input" placeholder="Enter text here..."></textarea>
            <br>
            <button id="extractButton"><b>Extract</b></button>
        </div>
        <div id="output">
            <h2>your text result :</h2>
            <p id="statusBox"></p>
            <h3>text tags:</h3>
            <ul id="tagsBox"></ul>
            <h3>foods:</h3>
            <ul id="foodsBox"></ul>
            <h3>drinks:</h3>
            <ul id="drinksBox"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
